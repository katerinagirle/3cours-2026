<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Память (React)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e 50%, #0f3460);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .wrap { text-align: center; padding: 20px; max-width: 520px; width: 100%; }
    h1 { font-size: 2rem; margin-bottom: 16px; }
    .info { display: flex; gap: 20px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    button {
      background: #e94560; color: #fff; border: none; border-radius: 8px;
      padding: 8px 18px; font-size: 1rem; cursor: pointer;
    }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .card {
      aspect-ratio: 1; background: #e94560; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; cursor: pointer; user-select: none;
    }
    .card.open { background: #fff; color: #111; }
    .card.matched { background: #2ecc71; color: #fff; }
    .win { margin-top: 20px; padding: 16px; background: rgba(255,255,255,0.1); border-radius: 12px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script>
    const e = React.createElement;
    const EMOJIS = ['🍎','🍌','🍇','🍉','🍓','🍒','🥝','🍑'];

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function makeCards() {
      return shuffle(EMOJIS.concat(EMOJIS)).map(function (emoji, i) {
        return { id: i, emoji: emoji, open: false, matched: false };
      });
    }

    function App() {
      const [cards, setCards] = React.useState(makeCards);
      const [opened, setOpened] = React.useState([]);
      const [moves, setMoves] = React.useState(0);
      const [lock, setLock] = React.useState(false);

      const pairs = cards.filter(function (c) { return c.matched; }).length / 2;
      const win = pairs === EMOJIS.length;

      function restart() {
        setCards(makeCards());
        setOpened([]);
        setMoves(0);
        setLock(false);
      }

      function clickCard(id) {
        if (lock) return;
        const card = cards.find(function (c) { return c.id === id; });
        if (!card || card.open || card.matched) return;
        if (opened.length === 2) return;

        const nextOpened = opened.concat([id]);
        setCards(cards.map(function (c) {
          return c.id === id ? Object.assign({}, c, { open: true }) : c;
        }));
        setOpened(nextOpened);

        if (nextOpened.length === 2) {
          setMoves(moves + 1);
          setLock(true);
          const a = cards.find(function (c) { return c.id === nextOpened[0]; });
          const b = cards.find(function (c) { return c.id === id; });

          if (a && b && a.emoji === b.emoji) {
            setCards(function (prev) {
              return prev.map(function (c) {
                if (c.id === nextOpened[0] || c.id === id) {
                  return Object.assign({}, c, { matched: true, open: true });
                }
                return c;
              });
            });
            setOpened([]);
            setLock(false);
          } else {
            setTimeout(function () {
              setCards(function (prev) {
                return prev.map(function (c) {
                  if (c.id === nextOpened[0] || c.id === id) {
                    return Object.assign({}, c, { open: false });
                  }
                  return c;
                });
              });
              setOpened([]);
              setLock(false);
            }, 700);
          }
        }
      }

      return e('div', { className: 'wrap' },
        e('h1', null, 'Игра «Память» (React)'),
        e('div', { className: 'info' },
          e('span', null, 'Ходы: ', e('strong', null, moves)),
          e('span', null, 'Пары: ', e('strong', null, pairs), ' / 8'),
          e('button', { onClick: restart }, 'Заново')
        ),
        e('div', { className: 'board' },
          cards.map(function (card) {
            var cls = 'card';
            if (card.open || card.matched) cls += ' open';
            if (card.matched) cls += ' matched';
            return e('div', {
              key: card.id,
              className: cls,
              onClick: function () { clickCard(card.id); }
            }, (card.open || card.matched) ? card.emoji : '?');
          })
        ),
        win ? e('div', { className: 'win' },
          e('p', null, 'Победа! 🎉'),
          e('p', null, 'Ходов: ' + moves),
          e('button', { onClick: restart }, 'Играть снова')
        ) : null
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(e(App));
  </script>
</body>
</html>
